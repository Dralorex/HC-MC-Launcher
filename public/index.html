<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Official Hollow Crown Launcher</title>
  <meta name="description" content="Official Hollow Crown Launcher. Not an official Minecraft product. The Windows download is not posted yet.">
  <style>
    :root {
      color-scheme: dark;
      --bg: #161513;
      --raised: #221f1c;
      --line: #4e4943;
      --text: #e7e1d8;
      --muted: #b7aea3;
      --bronze: #a56b32;
      --red: #8e2424;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(165, 107, 50, 0.18), transparent 42%),
        var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      line-height: 1.5;
    }

    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 4.5rem 1.5rem 3rem;
    }

    .mark {
      width: 4.5rem;
      height: 4.5rem;
      color: var(--bronze);
    }

    h1 {
      margin: 1.25rem 0 0.5rem;
      font-size: clamp(2rem, 5vw, 2.75rem);
      line-height: 1.1;
      font-weight: 700;
    }

    .lead {
      margin: 0;
      color: var(--muted);
      font-size: 1.125rem;
    }

    .notice {
      margin-top: 2rem;
      padding: 1.25rem 1.25rem 1.1rem;
      background: var(--raised);
      border: 1px solid var(--line);
      border-top: 3px solid var(--red);
      border-radius: 0.75rem;
    }

    .notice p {
      margin: 0;
    }

    .notice p + p {
      margin-top: 0.75rem;
    }

    .download {
      display: inline-block;
      margin-top: 1.25rem;
      padding: 0.7rem 1rem;
      border-radius: 0.5rem;
      background: #2a2622;
      color: var(--muted);
      border: 1px solid var(--line);
      font-weight: 600;
    }

    footer {
      margin-top: 2.5rem;
      color: var(--muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 512 512" aria-hidden="true">
      <path fill="currentColor" d="M80 360h352v48H80zM112 360l40-168 48 96 56-144 56 144 48-96 40 168H112z"/>
      <circle cx="256" cy="168" r="22" fill="currentColor"/>
    </svg>
    <h1>Official Hollow Crown Launcher</h1>
    <p class="lead">The Windows launcher for The Hollow Crown.</p>
    <section class="notice" aria-labelledby="download-status">
      <p id="download-status">The Windows download is not posted yet.</p>
      <p class="download">Windows download unavailable</p>
    </section>
    <footer>
      <p>This is not an official Minecraft product. It is not approved by or associated with Mojang or Microsoft.</p>
    </footer>
  </main>
</body>
</html>
